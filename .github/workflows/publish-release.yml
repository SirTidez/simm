name: Publish Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
          npm install --no-audit --prefer-offline

      - name: Resolve app version and release tag
        id: version
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $config.version
          if (-not $version) {
            throw 'Unable to determine app version from src-tauri/tauri.conf.json.'
          }

          $tag = "v${version}"
          $assetName = "SIMM_${version}_Setup.exe"

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "asset_name=$assetName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Enable updater artifacts for release build
        shell: pwsh
        run: |
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          if (-not $config.bundle) {
            $config | Add-Member -NotePropertyName bundle -NotePropertyValue ([ordered]@{}) -Force
          }
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

      - name: Build Windows installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: npm run tauri build -- --bundles nsis

      - name: Prepare release assets
        id: asset
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null

          $setupSources = @(Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.exe')
          if ($setupSources.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($setupSources.Count)."
          }
          $setupSource = $setupSources[0]

          $updaterZips = @(Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.nsis.zip')
          if ($updaterZips.Count -ne 1) {
            throw "Expected exactly one updater archive, found $($updaterZips.Count)."
          }
          $updaterZip = $updaterZips[0]

          $signatureSources = @(Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.nsis.zip.sig')
          if ($signatureSources.Count -ne 1) {
            throw "Expected exactly one updater archive signature, found $($signatureSources.Count)."
          }
          $signatureSource = $signatureSources[0]
          if ($signatureSource.BaseName -ne $updaterZip.Name) {
            throw "Updater signature '$($signatureSource.Name)' does not match updater archive '$($updaterZip.Name)'."
          }

          $setupTarget = Join-Path 'artifacts' '${{ steps.version.outputs.asset_name }}'
          Copy-Item -LiteralPath $setupSource.FullName -Destination $setupTarget -Force

          $updaterTarget = Join-Path 'artifacts' $updaterZip.Name
          Copy-Item -LiteralPath $updaterZip.FullName -Destination $updaterTarget -Force

          $signatureTarget = Join-Path 'artifacts' $signatureSource.Name
          Copy-Item -LiteralPath $signatureSource.FullName -Destination $signatureTarget -Force

          "setup_file=$setupTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "updater_file=$updaterTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "signature_file=$signatureTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ steps.version.outputs.version }}_ReleaseAssets
          path: |
            ${{ steps.asset.outputs.setup_file }}
            ${{ steps.asset.outputs.updater_file }}
            ${{ steps.asset.outputs.signature_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $assetPath = '${{ steps.asset.outputs.setup_file }}'
          $updaterAssetPath = '${{ steps.asset.outputs.updater_file }}'
          $signatureAssetPath = '${{ steps.asset.outputs.signature_file }}'
          $assetName = '${{ steps.version.outputs.asset_name }}'
          $updaterAssetName = Split-Path -Path $updaterAssetPath -Leaf
          $signatureAssetName = Split-Path -Path $signatureAssetPath -Leaf

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag "$assetPath#$assetName" "$updaterAssetPath#$updaterAssetName" "$signatureAssetPath#$signatureAssetName" --clobber
          } else {
            gh release create $tag "$assetPath#$assetName" "$updaterAssetPath#$updaterAssetName" "$signatureAssetPath#$signatureAssetName" --title $tag --generate-notes --latest --target $env:GITHUB_SHA
          }

      - name: Generate stable updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $updaterAssetPath = '${{ steps.asset.outputs.updater_file }}'
          $signaturePath = '${{ steps.asset.outputs.signature_file }}'
          $updaterAssetName = Split-Path -Path $updaterAssetPath -Leaf
          $release = gh release view $tag --json body,publishedAt | ConvertFrom-Json
          $assetUrl = "https://github.com/SirTidez/simm/releases/download/$tag/$updaterAssetName"

          .\scripts\generate-updater-manifest.ps1 `
            -Version '${{ steps.version.outputs.version }}' `
            -AssetUrl $assetUrl `
            -SignaturePath $signaturePath `
            -OutputPath 'updater/stable/latest.json' `
            -Notes ($release.body ?? '') `
            -PubDate ($release.publishedAt ?? '')

          $manifest = Get-Content 'updater/stable/latest.json' -Raw | ConvertFrom-Json
          $platform = $manifest.platforms.'windows-x86_64'
          if (-not $platform) {
            throw 'Stable updater manifest is missing the windows-x86_64 platform entry.'
          }
          if (-not $platform.url.EndsWith('.nsis.zip')) {
            throw "Stable updater manifest must point to the updater archive, got '$($platform.url)'."
          }
          if (-not $platform.signature) {
            throw 'Stable updater manifest is missing the updater signature.'
          }

      - name: Upload stable updater manifest to release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release upload $tag "updater/stable/latest.json#latest.json" --clobber

      - name: Commit stable updater manifest
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updater/stable/latest.json
          if (git diff --cached --quiet) {
            Write-Host 'No manifest changes to commit.'
            exit 0
          }

          git commit -m "chore(release): update stable updater manifest for ${{ steps.version.outputs.version }}"
          $branch = '${{ github.event.repository.default_branch }}'
          git fetch origin $branch
          git pull --rebase origin $branch
          git push origin HEAD:$branch
