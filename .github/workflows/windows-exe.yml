name: Build Setup Wizard

on:
  workflow_dispatch:

jobs:
  build-setup-wizard:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Configure Windows Authenticode signing
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          .\scripts\prepare-windows-signing.ps1 `
            -ConfigPath 'src-tauri/tauri.conf.json' `
            -CertificateBase64 $env:WINDOWS_CERTIFICATE `
            -CertificatePassword $env:WINDOWS_CERTIFICATE_PASSWORD `
            -CertificatePath (Join-Path $env:RUNNER_TEMP 'simm-windows-signing.pfx')

      - name: Build Windows setup wizard
        run: bun run tauri build --bundles nsis

      - name: Restore tauri config
        if: always()
        shell: pwsh
        run: git restore --worktree --source=HEAD -- src-tauri/tauri.conf.json

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $version = ''

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          if (-not $version) {
            $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            $version = $config.version
          }

          if (-not $version) {
            throw 'Unable to determine build version.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $version"

      - name: Inspect build outputs
        shell: pwsh
        run: |
          Write-Host "Listing target/release contents"
          if (Test-Path 'target/release') {
            Get-ChildItem -Path 'target/release' -Recurse | Select-Object FullName
          } else {
            Write-Host 'target/release does not exist'
          }

      - name: Prepare setup wizard artifact
        id: renamed
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null

          $setupSource = Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.exe' | Select-Object -First 1
          if (-not $setupSource) {
            throw 'Setup executable not found in target/release/bundle/nsis.'
          }

          $setupTarget = "artifacts/SIMM_${version}_Setup.exe"

          Copy-Item -LiteralPath $setupSource.FullName -Destination $setupTarget -Force

          .\scripts\verify-windows-signatures.ps1 `
            -Path @('target/release/simmrust.exe', $setupTarget) `
            -ExpectedThumbprint $env:SIMM_WINDOWS_SIGNING_THUMBPRINT

          "setup_file=$setupTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload setup wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ steps.version.outputs.version }}_Setup
          path: ${{ steps.renamed.outputs.setup_file }}
          if-no-files-found: error
          retention-days: 14

      - name: Remove Windows signing material
        if: always()
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'simm-windows-signing.pfx'
          if (Test-Path -LiteralPath $certificatePath) {
            Remove-Item -LiteralPath $certificatePath -Force
          }
          if ($env:SIMM_WINDOWS_SIGNING_THUMBPRINT) {
            $storePath = "Cert:\CurrentUser\My\$env:SIMM_WINDOWS_SIGNING_THUMBPRINT"
            if (Test-Path -LiteralPath $storePath) {
              Remove-Item -LiteralPath $storePath -Force
            }
          }
