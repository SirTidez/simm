name: Build Release Artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify manual build signing configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: |
          $required = [ordered]@{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_ENDPOINT = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            AZURE_ARTIFACT_SIGNING_ACCOUNT = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT
            AZURE_ARTIFACT_SIGNING_PROFILE = $env:AZURE_ARTIFACT_SIGNING_PROFILE
            WINDOWS_SIGNING_SUBJECT = $env:WINDOWS_SIGNING_SUBJECT
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            SIMM_UPDATER_PUBKEY = $env:SIMM_UPDATER_PUBKEY
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Manual release build signing is not configured. Missing GitHub settings: $($missing -join ', ')."
          }

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $version = ''

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          if (-not $version) {
            $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            $version = $config.version
          }

          if (-not $version) {
            throw 'Unable to determine build version.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $version"

      - name: Enable updater artifacts for manual build
        shell: pwsh
        run: |
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json -AsHashtable
          if (-not $config.ContainsKey('bundle') -or $null -eq $config.bundle) {
            $config.bundle = @{}
          }
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

      - name: Validate Windows app launch manifest
        run: bash scripts/validate-windows-app-manifest.sh

      - name: Build Windows application
        run: bun run tauri build --no-bundle

      - name: Azure login for Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows application with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\simmrust.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Schedule I Mod Manager
          description-url: https://github.com/SirTidez/simm

      - name: Verify signed Windows application
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          .\scripts\verify-windows-signatures.ps1 `
            -Path 'target/release/simmrust.exe' `
            -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT

      - name: Bundle signed Windows application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: bun run tauri bundle --bundles nsis

      - name: Resolve NSIS installer
        id: nsis
        shell: pwsh
        run: |
          $setupSources = @(Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.exe')
          if ($setupSources.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($setupSources.Count)."
          }

          $setupPath = $setupSources[0].FullName
          $signaturePath = "$setupPath.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Tauri did not generate the initial updater signature '$signaturePath'."
          }

          $initialSignatureHash = (Get-FileHash -LiteralPath $signaturePath -Algorithm SHA256).Hash
          "path=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "initial_signature_hash=$initialSignatureHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign Windows installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.nsis.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Schedule I Mod Manager Setup
          description-url: https://github.com/SirTidez/simm

      - name: Regenerate Tauri updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setupPath = '${{ steps.nsis.outputs.path }}'
          $signaturePath = "$setupPath.sig"
          Remove-Item -LiteralPath $signaturePath -Force

          bunx tauri signer sign $setupPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Tauri updater signing failed for the Authenticode-signed installer.'
          }
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Tauri updater signature was not regenerated: $signaturePath"
          }

          $regeneratedHash = (Get-FileHash -LiteralPath $signaturePath -Algorithm SHA256).Hash
          if ($regeneratedHash -ceq '${{ steps.nsis.outputs.initial_signature_hash }}') {
            throw 'The updater signature did not change after Authenticode modified the installer.'
          }

          $encodedSignature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          try {
            $signaturePayload = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encodedSignature))
          } catch {
            throw 'The regenerated Tauri updater signature is not valid base64.'
          }
          if (-not $signaturePayload.Contains('untrusted comment:') -or -not $signaturePayload.Contains('trusted comment:')) {
            throw 'The regenerated Tauri updater signature is not a minisign payload.'
          }

          Write-Host 'Regenerated the Tauri updater signature for the final Authenticode-signed installer.'

      - name: Prepare Windows build assets
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path 'artifacts/windows' -Force | Out-Null

          $setupSource = Get-Item -LiteralPath '${{ steps.nsis.outputs.path }}'
          $signatureSource = Get-Item -LiteralPath "$($setupSource.FullName).sig"

          $setupTarget = "artifacts/windows/SIMM_${version}_Setup.exe"
          $signatureTarget = "$setupTarget.sig"

          Copy-Item -LiteralPath $setupSource.FullName -Destination $setupTarget -Force
          Copy-Item -LiteralPath $signatureSource.FullName -Destination $signatureTarget -Force

          .\scripts\verify-windows-signatures.ps1 `
            -Path @('target/release/simmrust.exe', $setupTarget) `
            -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT

          $report = @('target/release/simmrust.exe', $setupTarget) | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_
            [ordered]@{
              file = Split-Path -Leaf $_
              status = $signature.Status.ToString()
              subject = $signature.SignerCertificate.Subject
              issuer = $signature.SignerCertificate.Issuer
              thumbprint = $signature.SignerCertificate.Thumbprint
              notAfter = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
            }
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "artifacts/windows/SIMM_${version}_Authenticode.json" -Encoding utf8NoBOM

      - name: Upload Windows build assets
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ steps.version.outputs.version }}_Windows
          path: artifacts/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore tauri config
        if: always()
        shell: pwsh
        run: git restore --worktree --source=HEAD -- src-tauri/tauri.conf.json

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: |
          $required = [ordered]@{
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            SIMM_UPDATER_PUBKEY = $env:SIMM_UPDATER_PUBKEY
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Manual Linux updater build is not configured. Missing GitHub settings: $($missing -join ', ')."
          }

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libfuse2 \
            libglib2.0-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            patchelf \
            pkg-config \
            librsvg2-dev

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $config.version
          if (-not $version) {
            throw 'Unable to determine app version from src-tauri/tauri.conf.json.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Enable updater artifacts for manual build
        shell: pwsh
        run: |
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json -AsHashtable
          if (-not $config.ContainsKey('bundle') -or $null -eq $config.bundle) {
            $config.bundle = @{}
          }
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

      - name: Build Linux packages
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: bun run tauri:build:linux

      - name: Restore tauri config
        if: always()
        shell: pwsh
        run: git restore --worktree --source=HEAD -- src-tauri/tauri.conf.json

      - name: Prepare Linux build assets
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path 'artifacts/linux' -Force | Out-Null

          $bundleRoots = @('target/release/bundle', 'src-tauri/target/release/bundle') | Where-Object { Test-Path -LiteralPath $_ }
          if ($bundleRoots.Count -eq 0) {
            throw 'No Tauri bundle output directory was found.'
          }

          $appImageSources = @($bundleRoots | ForEach-Object {
            Get-ChildItem -Path (Join-Path $_ 'appimage') -File -Filter '*.AppImage' -ErrorAction SilentlyContinue
          })
          if ($appImageSources.Count -ne 1) {
            throw "Expected exactly one AppImage, found $($appImageSources.Count)."
          }

          $appImageSource = $appImageSources[0]
          $appImageSignaturePath = "$($appImageSource.FullName).sig"
          if (-not (Test-Path -LiteralPath $appImageSignaturePath -PathType Leaf)) {
            throw "Updater signature '$appImageSignaturePath' was not generated for AppImage '$($appImageSource.Name)'."
          }

          $debSources = @($bundleRoots | ForEach-Object {
            Get-ChildItem -Path (Join-Path $_ 'deb') -File -Filter '*.deb' -ErrorAction SilentlyContinue
          })
          if ($debSources.Count -ne 1) {
            throw "Expected exactly one deb package, found $($debSources.Count)."
          }

          $appImageTarget = "artifacts/linux/SIMM_${version}_x86_64.AppImage"
          $appImageSignatureTarget = "$appImageTarget.sig"
          $debTarget = "artifacts/linux/SIMM_${version}_amd64.deb"
          Copy-Item -LiteralPath $appImageSource.FullName -Destination $appImageTarget -Force
          Copy-Item -LiteralPath $appImageSignaturePath -Destination $appImageSignatureTarget -Force
          Copy-Item -LiteralPath $debSources[0].FullName -Destination $debTarget -Force
          Copy-Item -LiteralPath 'install.sh' -Destination 'artifacts/linux/install.sh' -Force

      - name: Validate Linux desktop scheme handlers
        shell: bash
        run: |
          bash -n install.sh
          bash scripts/validate-linux-desktop-mime.sh "artifacts/linux/SIMM_${{ steps.version.outputs.version }}_amd64.deb"
          bash scripts/validate-linux-desktop-mime.sh "artifacts/linux/SIMM_${{ steps.version.outputs.version }}_x86_64.AppImage"

      - name: Upload Linux build assets
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ steps.version.outputs.version }}_Linux
          path: artifacts/linux/*
          if-no-files-found: error
          retention-days: 14

  validate-artifacts:
    needs:
      - build-windows
      - build-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Download Windows and Linux build assets
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build checksums and validate updater artifact set
        shell: pwsh
        run: |
          $version = '${{ needs.build-windows.outputs.version }}'
          $checksumPath = Join-Path 'artifacts' 'SHA256SUMS'
          $checksumLines = @(Get-ChildItem -Path 'artifacts' -File | Where-Object { $_.Name -ne 'SHA256SUMS' } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          })
          Set-Content -LiteralPath $checksumPath -Encoding ascii -Value $checksumLines

          python .codex/skills/simmrust-release-updater/scripts/check_release_artifacts.py `
            --artifacts-only `
            --artifact-dir artifacts `
            --package-version $version
          if ($LASTEXITCODE -ne 0) {
            throw 'Manual Windows/Linux updater artifact validation failed.'
          }

      - name: Upload complete release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ needs.build-windows.outputs.version }}_Release_Artifacts
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14
