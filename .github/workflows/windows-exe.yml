name: Build Setup Wizard

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-setup-wizard:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.5"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Verify signing test configuration
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_ARTIFACT_SIGNING_ENDPOINT: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          AZURE_ARTIFACT_SIGNING_ACCOUNT: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          AZURE_ARTIFACT_SIGNING_PROFILE: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: |
          $required = [ordered]@{
            AZURE_CLIENT_ID = $env:AZURE_CLIENT_ID
            AZURE_TENANT_ID = $env:AZURE_TENANT_ID
            AZURE_SUBSCRIPTION_ID = $env:AZURE_SUBSCRIPTION_ID
            AZURE_ARTIFACT_SIGNING_ENDPOINT = $env:AZURE_ARTIFACT_SIGNING_ENDPOINT
            AZURE_ARTIFACT_SIGNING_ACCOUNT = $env:AZURE_ARTIFACT_SIGNING_ACCOUNT
            AZURE_ARTIFACT_SIGNING_PROFILE = $env:AZURE_ARTIFACT_SIGNING_PROFILE
            WINDOWS_SIGNING_SUBJECT = $env:WINDOWS_SIGNING_SUBJECT
            TAURI_SIGNING_PRIVATE_KEY = $env:TAURI_SIGNING_PRIVATE_KEY
            SIMM_UPDATER_PUBKEY = $env:SIMM_UPDATER_PUBKEY
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "Windows signing test is not configured. Missing GitHub settings: $($missing -join ', ')."
          }

      - name: Resolve build version
        id: version
        shell: pwsh
        run: |
          $version = ''

          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME.StartsWith('v')) {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          }

          if (-not $version) {
            $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
            $version = $config.version
          }

          if (-not $version) {
            throw 'Unable to determine build version.'
          }

          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Resolved version: $version"

      - name: Enable updater artifacts for signing test
        shell: pwsh
        run: |
          $configPath = 'src-tauri/tauri.conf.json'
          $config = Get-Content $configPath -Raw | ConvertFrom-Json -AsHashtable
          if (-not $config.ContainsKey('bundle') -or $null -eq $config.bundle) {
            $config.bundle = @{}
          }
          $config.bundle.createUpdaterArtifacts = $true
          $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8NoBOM

      - name: Validate Windows app launch manifest
        run: bash scripts/validate-windows-app-manifest.sh

      - name: Build Windows application
        run: bun run tauri build --no-bundle

      - name: Azure login for Artifact Signing
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign Windows application with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ github.workspace }}\target\release\simmrust.exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Schedule I Mod Manager
          description-url: https://github.com/SirTidez/simm

      - name: Verify signed Windows application
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          .\scripts\verify-windows-signatures.ps1 `
            -Path 'target/release/simmrust.exe' `
            -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT

      - name: Bundle signed Windows application
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SIMM_UPDATER_PUBKEY: ${{ secrets.SIMM_UPDATER_PUBKEY }}
        run: bun run tauri bundle --bundles nsis

      - name: Resolve NSIS installer
        id: nsis
        shell: pwsh
        run: |
          $setupSources = @(Get-ChildItem -Path 'target/release/bundle/nsis' -File -Filter '*.exe')
          if ($setupSources.Count -ne 1) {
            throw "Expected exactly one NSIS setup executable, found $($setupSources.Count)."
          }

          $setupPath = $setupSources[0].FullName
          $signaturePath = "$setupPath.sig"
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Tauri did not generate the initial updater signature '$signaturePath'."
          }

          $initialSignatureHash = (Get-FileHash -LiteralPath $signaturePath -Algorithm SHA256).Hash
          "path=$setupPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "initial_signature_hash=$initialSignatureHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Sign Windows installer with Azure Artifact Signing
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_PROFILE }}
          files: ${{ steps.nsis.outputs.path }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          description: Schedule I Mod Manager Setup
          description-url: https://github.com/SirTidez/simm

      - name: Regenerate Tauri updater signature
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $setupPath = '${{ steps.nsis.outputs.path }}'
          $signaturePath = "$setupPath.sig"
          Remove-Item -LiteralPath $signaturePath -Force

          bunx tauri signer sign $setupPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Tauri updater signing failed for the Authenticode-signed installer.'
          }
          if (-not (Test-Path -LiteralPath $signaturePath -PathType Leaf)) {
            throw "Tauri updater signature was not regenerated: $signaturePath"
          }

          $regeneratedHash = (Get-FileHash -LiteralPath $signaturePath -Algorithm SHA256).Hash
          if ($regeneratedHash -ceq '${{ steps.nsis.outputs.initial_signature_hash }}') {
            throw 'The updater signature did not change after Authenticode modified the installer.'
          }

          $encodedSignature = (Get-Content -LiteralPath $signaturePath -Raw).Trim()
          try {
            $signaturePayload = [Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($encodedSignature))
          } catch {
            throw 'The regenerated Tauri updater signature is not valid base64.'
          }
          if (-not $signaturePayload.Contains('untrusted comment:') -or -not $signaturePayload.Contains('trusted comment:')) {
            throw 'The regenerated Tauri updater signature is not a minisign payload.'
          }

          Write-Host 'Regenerated the Tauri updater signature for the final Authenticode-signed installer.'

      - name: Prepare setup wizard artifact
        id: renamed
        shell: pwsh
        env:
          WINDOWS_SIGNING_SUBJECT: ${{ vars.WINDOWS_SIGNING_SUBJECT }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null

          $setupSource = Get-Item -LiteralPath '${{ steps.nsis.outputs.path }}'
          $signatureSource = Get-Item -LiteralPath "$($setupSource.FullName).sig"

          $setupTarget = "artifacts/SIMM_${version}_Setup.exe"
          $signatureTarget = "$setupTarget.sig"

          Copy-Item -LiteralPath $setupSource.FullName -Destination $setupTarget -Force
          Copy-Item -LiteralPath $signatureSource.FullName -Destination $signatureTarget -Force

          .\scripts\verify-windows-signatures.ps1 `
            -Path @('target/release/simmrust.exe', $setupTarget) `
            -ExpectedSubject $env:WINDOWS_SIGNING_SUBJECT

          $report = @('target/release/simmrust.exe', $setupTarget) | ForEach-Object {
            $signature = Get-AuthenticodeSignature -LiteralPath $_
            [ordered]@{
              file = Split-Path -Leaf $_
              status = $signature.Status.ToString()
              subject = $signature.SignerCertificate.Subject
              issuer = $signature.SignerCertificate.Issuer
              thumbprint = $signature.SignerCertificate.Thumbprint
              notAfter = $signature.SignerCertificate.NotAfter.ToUniversalTime().ToString('o')
            }
          }
          $report | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "artifacts/SIMM_${version}_Authenticode.json" -Encoding utf8NoBOM

          "setup_file=$setupTarget" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Upload setup wizard artifact
        uses: actions/upload-artifact@v4
        with:
          name: SIMM_${{ steps.version.outputs.version }}_Azure_Signing_Test
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Restore tauri config
        if: always()
        shell: pwsh
        run: git restore --worktree --source=HEAD -- src-tauri/tauri.conf.json
