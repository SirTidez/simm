[package]
name = "simmrust"
version = "0.8.6"
description = "Schedule I Developer Environment Manager"
authors = ["LockWire Labs"]
license = "AGPL-3.0"
repository = "https://github.com/SirTidez/simm"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["test", "protocol-asset"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-dialog = "2.7.0"
tauri-plugin-fs = "2.5.0"
tauri-plugin-deep-link = "2.4.8"
tauri-plugin-process = "2"
tauri-plugin-updater = "2.10.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
thiserror = "1.0"
uuid = { version = "1.0", features = ["v4", "serde"] }
regex = "1.10"
zip = "0.6"
unrar = "0.5"
sevenz-rust = "0.6.1"
tar = "0.4"
reqwest = { version = "0.11", features = ["json", "multipart"] }
flate2 = "1.1"
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
dirs = "5.0"
aes-gcm = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
octocrab = "0.36"
dotenv = "0.15"
governor = "0.6"
once_cell = "1.19"
urlencoding = "2.1"
quick-xml = { version = "0.31", features = ["serialize"] }
log = "0.4"
env_logger = "0.11"
discord-rich-presence = "1.0"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate"] }
nexus-api = { git = "https://github.com/SirTidez/nexusmods-api-handler.git", rev = "494f754de30b4890be1d42dfadb6168905b41aa4" }
tempfile = "3.10"

[dev-dependencies]
serial_test = "3.0"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "handleapi", "minwinbase", "winbase", "winnt", "winuser", "shellapi"] }
winreg = "0.55"
tauri-plugin-single-instance = { version = "2.4.1", features = ["deep-link"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
tauri-plugin-single-instance = { version = "2.4.1", features = ["deep-link"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
